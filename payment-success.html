<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) - conversion tracking only, placed only on
     this checkout-confirmation page on purpose. Tells Google Ads
     when an ad led to a real signup; does not build a remarketing
     audience from site-wide browsing (see security.html). -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18397715597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18397715597');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment successful - Mission Bridge Archive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #2B3A4A; --cream: #FFFFFF; --clay: #B8874A; --clay-deep: #96703A; --charcoal: #171B21;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream); color: var(--charcoal); font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center;
  }
  .check-badge {
    width: 56px; height: 56px; border-radius: 50%; background: var(--navy);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
  }
  h1 { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--navy); font-size: 30px; margin-bottom: 12px; }
  p { color: rgba(23,27,33,0.65); font-size: 16px; max-width: 420px; margin: 0 auto 8px; }
  a { color: var(--clay-deep); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div>
    <div class="check-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Payment received, thank you.</h1>
    <p>Nothing else to do on your end, we've got it from here.</p>
    <p>Questions? Email <a href="mailto:tyler@getmissionbridge.com">tyler@getmissionbridge.com</a> anytime.</p>
  </div>

<script>
// First-party page tracking - stays on our own server, never sent to
// a third party. Just tells us which pages get visited and roughly
// where traffic came from, so we know what's working.
(function () {
  try {
    let visitorId = localStorage.getItem('mb_visitor_id');
    if (!visitorId) {
      visitorId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem('mb_visitor_id', visitorId);
    }
    const params = new URLSearchParams(window.location.search);
    let referrer = 'Direct';
    if (document.referrer) {
      try { referrer = new URL(document.referrer).hostname || 'Direct'; } catch (e) {}
    }
    fetch('https://missionbridge-backend.onrender.com/track/pageview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: window.location.pathname,
        referrer,
        utmSource: params.get('utm_source'),
        utmMedium: params.get('utm_medium'),
        utmCampaign: params.get('utm_campaign'),
        visitorId,
      }),
    }).catch(function () {});
  } catch (e) {}
})();
</script>

</body>
</html>
